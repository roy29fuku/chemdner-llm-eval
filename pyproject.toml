[project]
name = "chemdner-bench"
version = "0.2.0.dev0"
description = "CHEMDNER（化学物質名の抽出）で、同じ LLM に直接解かせる場合とコードを書かせる場合を比べる実験基盤"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "openai>=3.20.0",
    "python-dotenv>=1.2.3",
]

[dependency-groups]
dev = [
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chemdner_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "corpus: 実際のコーパス（NCBI の配布ファイル）が手元にあるときだけ走るテスト",
]

